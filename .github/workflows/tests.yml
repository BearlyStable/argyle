# Runs the whole test suite on every Python the project supports: 3.6 to 3.15 on Linux, 3.8 to 3.15 on Windows.
#
# End-of-life interpreters (3.6 to 3.10) run in the official python:X-slim container, the same way
# README.md suggests trying 3.6 locally; hosted runners no longer provide them reliably. Current
# interpreters use actions/setup-python. From 3.7 on the suite runs in strict mode (-X dev turns on
# ResourceWarning and asyncio debug checks, -W error makes any warning a failure); -X dev does not
# exist on 3.6. Windows starts at 3.8, the first version whose default event loop (Proactor) is not
# limited to 512 sockets by select(). A pushed v* tag must match what proxy.py --version prints.
name: tests

on:
  push:
    branches: ['**']   # branches only; a v* tag is tested via release.yml's reuse of this workflow
  pull_request:
  workflow_dispatch:
  workflow_call:       # release.yml runs this whole suite as its gate before publishing

permissions:
  contents: read

jobs:
  end-of-life:
    name: Python ${{ matrix.python }} (container)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.6"
            flags: ""
          - python: "3.7"
            flags: "-X dev -W error"
          - python: "3.8"
            flags: "-X dev -W error"
          - python: "3.9"
            flags: "-X dev -W error"
          - python: "3.10"
            flags: "-X dev -W error"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the test suite
        run: >
          docker run --rm -v "$PWD":/w:ro -w /w python:${{ matrix.python }}-slim
          python ${{ matrix.flags }} -m unittest discover -s tests -t . -v

  supported:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite
        run: python -X dev -W error -m unittest discover -s tests -t . -v

  windows:
    name: Python ${{ matrix.python }} (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite
        run: python -X dev -W error -m unittest discover -s tests -t . -v

  release-version:
    name: Tag matches --version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare the tag with proxy.py --version
        run: |
          expected="proxy.py ${GITHUB_REF_NAME#v}"
          actual="$(python3 proxy.py --version)"
          echo "tag: $expected, proxy.py: $actual"
          test "$actual" = "$expected"
